<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Terminal v4.0</title>
    <style>
        /* Estética TRON / Terminal Corporativa */
        body {
            background-color: #050505;
            color: #00ff66; /* Verde Neón Hacker */
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            transition: background 0.2s;
        }
        .pantalla-roja {
            background-color: #ff0000 !important;
            color: #ffffff !important;
            animation: parpadeo 0.4s infinite;
        }
        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        #lluvia {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .caja-seguridad {
            position: relative;
            z-index: 1;
            background: #111;
            border: 2px solid #00ff66;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            max-width: 450px;
            width: 100%;
        }
        input {
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            width: 80%;
            margin-bottom: 15px;
            border-radius: 4px;
            font-family: inherit;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            width: 85%;
            font-family: inherit;
        }
        button:active {
            background: #00aa44;
        }
        .lineas {
            letter-spacing: -1px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <canvas id="lluvia"></canvas>

    <div class="caja-seguridad" id="contenedor">
        <h2>🛡️ CENTRO DE SEGURIDAD OPERATIVA (SOC) v4.0 🛡️</h2>
        <p>ESTADO: MONITOREANDO INTENTOS DE INTRUSIÓN...</p>
        <p id="intentos" style="color: #ffcc00;">⚠️ SEÑAL ENCRIPTADA | Intentos restantes: 3</p>

        <input type="password" id="token" placeholder="Ingrese token de 4 dígitos" maxlength="4">
        <button onclick="verificarAcceso()">VERIFICAR CREDENCIALES</button>

        <h4 id="mensaje" style="margin-top: 20px; white-space: pre-line;"></h4>
    </div>

    <script>
        let intentosRestantes = 3;
        const claveCorrecta = "2026";

        // Lluvia de letras estilo Matrix (fondo)
        let colorLluvia = "#00ff66";
        (function iniciarLluvia() {
            if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            const canvas = document.getElementById("lluvia");
            const ctx = canvas.getContext("2d");
            const letras = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF";
            const tamano = 16;
            let columnas, gotas;

            function ajustar() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                columnas = Math.floor(canvas.width / tamano);
                gotas = Array.from({ length: columnas }, () => Math.random() * -50);
            }
            ajustar();
            window.addEventListener("resize", ajustar);

            function dibujar() {
                // desvanece lo anterior sin tapar el fondo (así deja estela)
                ctx.globalCompositeOperation = "destination-out";
                ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = "source-over";

                ctx.fillStyle = colorLluvia;
                ctx.font = tamano + "px monospace";
                for (let i = 0; i < columnas; i++) {
                    const letra = letras[Math.floor(Math.random() * letras.length)];
                    ctx.fillText(letra, i * tamano, gotas[i] * tamano);
                    if (gotas[i] * tamano > canvas.height && Math.random() > 0.975) {
                        gotas[i] = 0;
                    }
                    gotas[i]++;
                }
            }
            setInterval(dibujar, 50);
        })();

        // Alarma de lockdown tipo bocina de película (grave y fuerte)
        function sonarSirena() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const volumen = ctx.createGain();
                volumen.gain.value = 0.3;
                volumen.connect(ctx.destination);

                // Dos ondas juntas para que suene más áspera y real
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                osc1.type = "sawtooth";
                osc2.type = "square";
                osc2.detune.value = 700; // una quinta arriba
                osc1.connect(volumen);
                osc2.connect(volumen);
                osc1.start();
                osc2.start();

                // Cada vuelta: el tono sube rápido y baja (WUUUH...)
                function bocina() {
                    const t = ctx.currentTime;
                    [osc1, osc2].forEach(o => {
                        o.frequency.cancelScheduledValues(t);
                        o.frequency.setValueAtTime(300, t);
                        o.frequency.linearRampToValueAtTime(560, t + 0.35);
                        o.frequency.linearRampToValueAtTime(300, t + 0.9);
                    });
                }
                bocina();
                setInterval(bocina, 1000); // una bocina por segundo
            } catch (e) {
                console.log("No se pudo reproducir la alarma", e);
            }
        }

        function verificarAcceso() {
            let entrada = document.getElementById("token").value.trim();
            let mensajeTxt = document.getElementById("mensaje");
            let intentosTxt = document.getElementById("intentos");
            let contenedor = document.getElementById("contenedor");

            if (intentosRestantes > 0) {
                if (entrada === claveCorrecta) {
                    mensajeTxt.style.color = "#00bcff"; // Azul TRON elegante
                    mensajeTxt.innerHTML = "<br>🔓 [ACCESO AUTORIZADO] DESENCRIPTACIÓN EXITOSA.<br>Bienvenido, Usuario.";
                    document.getElementById("token").disabled = true;
                } else {
                    intentosRestantes--;
                    intentosTxt.innerHTML = `⚠️ SEÑAL ENCRIPTADA | Intentos restantes: ${intentosRestantes}`;

                    if (intentosRestantes > 0) {
                        mensajeTxt.style.color = "#ff3333";
                        mensajeTxt.innerHTML = "❌ [ERROR DE AUTENTICACIÓN] Token no válido.";
                    } else {
                        // ¡LOCKDOWN TOTAL CORPORATIVO!
                        document.body.classList.add("pantalla-roja");
                        colorLluvia = "#ffffff"; // la lluvia se pone blanca en el lockdown
                        contenedor.style.background = "#000";
                        contenedor.style.borderColor = "#fff";
                        sonarSirena(); // Dispara la sirena

                        document.getElementById("token").disabled = true;
                        intentosTxt.innerHTML = "🚨 TERMINAL TOTALMENTE CONGELADA 🚨";
                        intentosTxt.style.color = "#fff";

                        mensajeTxt.style.color = "#fff";
                        mensajeTxt.innerHTML = `
                            <span class="lineas">==================================================</span>
                            🚨 LOCKDOWN ACTIVADO: ¡SISTEMA BLOQUEADO POR SEGURIDAD! 🚨
                            <span class="lineas">==================================================</span>
                            DETECCIÓN: Ataque de fuerza bruta o intrusión no autorizada.
                            ACCIÓN: Se ha enviado un reporte inmediato al Sistema de Seguridad.
                            CONEXIÓN: Dirección IP guardada en la base de datos local.
                            ¡Muchos intentos fallidos! Terminal congelada por 15 minutos.
                            <span class="lineas">==================================================</span>
                        `;
                    }
                }
            }
        }
    </script>
</body>
</html>
